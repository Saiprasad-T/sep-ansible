- name: Check if nginx module is enabled
  ansible.builtin.shell:
    cmd: dnf module list nginx | grep  '1.24.*\[e\]'
  register: nginx_module
  changed_when: false
  failed_when: false

- name: Disable current NodeJS module
  ansible.builtin.command:
    cmd: dnf module disable nginx -y
  when: nginx_module.rc == 1

- name: Check nginx 1.24 module
  ansible.builtin.shell:
    cmd: dnf module list nginx | grep '1.24.*\[e\]'
  register: nginx24_module
  changed_when: false
  failed_when: false

- name: Enable nginx 1.24
  ansible.builtin.command:
    cmd: dnf module enable nginx:1.24 -y
  when: nginx24_module.rc == 1

- name: installing nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: starting and enabling nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Removing the default content
  ansible.builtin.file:
    path: /usr/share/nginx/html/index.html
    state: absent

- name: Download frontend zip
  ansible.builtin.get_url:
    url: https://roboshop-artifacts.s3.amazonaws.com/frontend-v3.zip
    dest: /tmp/frontend.zip

- name: Extract frontend zip
  ansible.builtin.unarchive:
    src: /tmp/frontend.zip
    dest: /app
    remote_src: true

- name: configuring catalogue.service file
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify: restart nginx
